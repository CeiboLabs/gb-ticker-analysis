name = "ticker"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages — output directory from @cloudflare/next-on-pages build
pages_build_output_dir = ".vercel/output/static"

# D1 binding for the usage / failure monitor.
# Create the DB once with `wrangler d1 create ticker-metrics` and paste the
# returned database_id below. Apply schema with:
#   wrangler d1 execute ticker-metrics --file=db/schema.sql --remote
# Local dev uses a separate sqlite file under .wrangler/ — apply with --local.
[[d1_databases]]
binding       = "METRICS_DB"
database_name = "ticker-metrics"
database_id   = "3cc6d984-1c52-437a-a45e-38fe1b3b54dd"

# Retention: Pages no soporta crons nativos. Para limpiar eventos viejos
# llamar a /api/admin/retention?days=90 desde un cron externo (Worker con
# cron trigger, cron-job.org, etc.) con header x-admin-token: $ADMIN_TOKEN.

# Variables de entorno usadas en runtime (configurar en Cloudflare Pages
# Settings → Environment variables, o con `wrangler pages secret put`):
#
#   ADMIN_TOKEN                  — token largo y aleatorio (UUID o 32+ chars).
#                                  Sin esto cualquier llamada a /api/admin/*
#                                  es rechazada (fail-closed).
#   OPENAI_API_KEY               — key de la cuenta que paga los análisis.
#   LOGO_DEV_TOKEN               — opcional, mejora la calidad de logos.
#
# Rate-limit knobs (todos opcionales, defaults seguros). Todo se kea por IP
# con contadores durables en D1 (tabla rate_limits) — nada de cookies:
#   RATE_LIMIT_IP_MAX            — 100 análisis/h por IP.
#   RATE_LIMIT_DAILY_FRESH_MAX   — 150 análisis frescos (cache miss) por
#                                  IP/día. Cap durísimo sobre el costo
#                                  OpenAI; cache hits no cuentan. Resetea a
#                                  medianoche UY.
#   RATE_LIMIT_IP_ALLOWLIST      — IPs de NATs confiables (oficinas), coma-
#                                  separadas. Reciben el multiplicador, NO
#                                  un bypass.
#   RATE_LIMIT_ALLOWLIST_MULTIPLIER — 10× los caps para IPs allowlisted.
