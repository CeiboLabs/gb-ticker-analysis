# Reverse proxy del home server — nginx delante de `next start`.
#
# ── POR QUÉ EXISTE ───────────────────────────────────────────────────────────
# Todos los gates de lib/rateLimiter.ts se keyean por IP, y la IP la resuelve
# `trustedClientIp()`, que sólo confía en `cf-connecting-ip`. Fuera de Cloudflare
# ese header no existe ⇒ devuelve null ⇒ los límites por IP quedan sin reparto y
# sobrevive nada más el techo global. Este proxy es lo que le devuelve la IP real
# a la app, y con ella el reparto por visitante.
#
# ── POR QUÉ NGINX Y NO CADDY ─────────────────────────────────────────────────
# docs/RUNBOOK-home.md venía recomendando Caddy, y para TLS tendría razón. Pero
# acá TLS ya lo termina Tailscale, así que la ventaja de Caddy no aplica; lo que
# hace falta es rate limiting, y en Caddy eso es un plugin que obliga a compilar
# con xcaddy. En nginx `limit_req` y `limit_conn` vienen de fábrica.
#
# ── POR QUÉ PROXY PROTOCOL Y NO X-FORWARDED-FOR ──────────────────────────────
# Tailscale Funnel NO le pasa la IP pública del visitante al backend: es un
# feature request abierto desde julio de 2024 (tailscale/tailscale#12972),
# pedido justamente para poder hacer rate limiting. En modo HTTPS lo único que
# llega es la IP de Tailscale. El ÚNICO camino que hoy trae la IP de verdad es
# el forwarder TCP con PROXY protocol, que la mete en la cabecera de la conexión
# en vez de en un header HTTP:
#
#   tailscale funnel --bg --tls-terminated-tcp=443 --proxy-protocol=1 \
#     tcp://127.0.0.1:8789
#
# O sea: Tailscale termina TLS, y lo que llega acá es HTTP plano precedido del
# preámbulo PROXY. De ahí el `listen ... proxy_protocol` de abajo.
#
# ⚠️ NO VERIFICADO CONTRA gestapp. Está escrito desde la documentación y desde
# los flags del `tailscale` 1.102.2 instalado, pero cambiar el modo del funnel
# reemplaza la forma en que el sitio se publica. Aplicalo con la checklist de
# docs/RUNBOOK-home.md § «Reverse proxy», que incluye cómo comprobar que la IP
# llega y cómo volver atrás en una línea.

# ── Zonas ────────────────────────────────────────────────────────────────────
# Van en el contexto http{} (en Debian/Ubuntu: dentro de /etc/nginx/nginx.conf,
# NO en el bloque server de abajo). 10m alcanza para ~160k IPs distintas.

limit_req_zone  $binary_remote_addr zone=bng_general:10m   rate=30r/s;
limit_req_zone  $binary_remote_addr zone=bng_descargas:10m rate=1r/s;
limit_req_zone  $binary_remote_addr zone=bng_login:10m     rate=10r/m;
limit_conn_zone $binary_remote_addr zone=bng_conn:10m;

# Log con la IP ya resuelta: es lo que se mira para confirmar que el PROXY
# protocol está funcionando (si acá aparece 127.0.0.1, NO está andando).
log_format bng '$remote_addr $proxy_protocol_addr "$request" $status '
               '$body_bytes_sent rt=$request_time';

server {
    # `proxy_protocol` es obligatorio acá: si el funnel manda el preámbulo y
    # nginx no lo espera, la primera línea de la petición se lee como basura y
    # todo devuelve 400. Y al revés también rompe. Los dos lados se cambian
    # juntos, siempre.
    listen 8789 proxy_protocol;

    access_log /var/log/nginx/bng.access.log bng;
    error_log  /var/log/nginx/bng.error.log warn;

    # La IP real viene del preámbulo PROXY, no de un header. `set_real_ip_from`
    # dice de qué origen se acepta esa afirmación: sólo loopback, que es por
    # donde entra tailscaled. Sin esta línea $remote_addr sería 127.0.0.1 y los
    # límites de abajo agruparían a TODO internet en un solo balde.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;

    # El sitio sirve PDFs y video; sin techo de tamaño de respuesta no hay
    # problema, pero sí conviene acotar lo que ENTRA (uploads del panel: 15 MB
    # los valida lib/pdfUpload.ts, acá va un poco más alto para que el rechazo
    # lo dé la app con un mensaje y no nginx con un 413 pelado).
    client_max_body_size 20m;

    # Concurrencia por IP. Es lo que mod_ratelimit NO puede hacer en el cPanel
    # del fondo: ahí un atacante abre N conexiones y multiplica el caudal por N.
    # Acá 20 simultáneas alcanzan de sobra para una pestaña real (HTTP/1.1 usa
    # 6 por host) y le ponen tope al que paraleliza descargas.
    limit_conn bng_conn 20;

    # Techo general. Generoso a propósito: una carga en frío dispara decenas de
    # pedidos (chunks de Next, imágenes) y un límite estrecho rompería la página
    # antes que a nadie. `nodelay` sirve la ráfaga al toque y sólo corta al que
    # sostiene el ritmo.
    limit_req zone=bng_general burst=100 nodelay;
    limit_req_status 429;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;

        # ── Los cuatro headers que sostienen todo lo de arriba ──
        # X-Real-IP es el que lee `trustedClientIp()` cuando TRUSTED_PROXY=1.
        # Se SETEAN (no se agregan): así se pisa cualquier valor que el cliente
        # haya mandado. Sin esto, un `X-Real-IP: <lo que se le cante>` le
        # dejaría al atacante un balde nuevo por request y el gate sería humo.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header Host             $host;
        # Tailscale ya terminó TLS, así que lo que llega acá es HTTP plano. Sin
        # esta línea la app se cree servida por http y la cookie `__Host-…;
        # Secure` del panel no viaja ⇒ login imposible.
        proxy_set_header X-Forwarded-Proto https;

        # /analisis responde por SSE: sin esto el buffer se come el stream y el
        # informe aparece de golpe al final, o se corta por timeout.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Descargas: caro por request, y ningún humano hace más de un puñado.
    # Es el mismo criterio que `checkDownloadLimit` aplica en la app; tenerlo en
    # las dos capas no es redundante — acá se corta ANTES de despertar a Node.
    location ~ ^/(informes/[^/]+/pdf|api/fondo/documentos/) {
        limit_req zone=bng_descargas burst=5 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header Host             $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Login del panel: 10 por minuto por IP. El lockout de lib/rateLimiter.ts
    # sigue siendo el que manda (y el de por-cuenta, el que de verdad frena el
    # guessing); esto sólo evita que el PBKDF2 se despierte a ritmo de máquina.
    location /api/admin/panel/auth/ {
        limit_req zone=bng_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header Host             $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Video: 13 MB en public/ y nadie linkea legítimamente a un .mp4 suelto.
    # Acá SÍ va bloqueo por Referer, al revés que en los PDF del fondo (ver el
    # comentario largo en scripts/build-fondo.mts): un video es un asset que se
    # embebe, no un documento que se cita, así que cortar el hotlink no le niega
    # nada a nadie. El Referer vacío se permite —es lo que manda el propio
    # <video> en algunos navegadores, y bloquearlo rompería la home.
    location /video/ {
        valid_referers none blocked server_names
                       gbengochea.com.uy *.gbengochea.com.uy
                       bengocheainversiones.com *.bengocheainversiones.com
                       gestapp.tail75b274.ts.net;
        if ($invalid_referer) {
            return 403;
        }
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $remote_addr;
        proxy_set_header Host             $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
